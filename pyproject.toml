[project]
name = "ha-pv-sizer"
version = "0.1.0"
description = "Home Assistant integration to size photovoltaics and batteries on your own consumption."
requires-python = ">=3.13"
license = "MIT"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
