name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.14
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Panel bundle has no Node globals
        run: "! grep -qE 'process\\.(env|nextTick)' ../custom_components/pv_sizer/frontend/pv-sizer-panel.js"
      - name: Golden fixtures match the demo backend
        run: npm run fixtures && git diff --exit-code ../tests/fixtures
